<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Octavia Sirbu</title>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">
          <span class="logo-mark" aria-hidden="true"><img class="logo-mark-img" src="assets/portfolio-logo.svg" alt="" width="130" height="114" decoding="async" /></span>
          <span class="logo-text">Octavia Sirbu</span>
        </a>
        <div class="nav-right">
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
          </ul>
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Switch to dark mode"
            aria-pressed="false"
            title="Light or dark mode"
          >
            <span class="theme-toggle-track">
              <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <img src="assets/icons/sun-03.svg" alt="" width="14" height="14" decoding="async" />
              </span>
              <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <img src="assets/icons/moon.svg" alt="" width="14" height="14" decoding="async" />
              </span>
              <span class="theme-toggle-thumb" aria-hidden="true"></span>
            </span>
          </button>
        </div>
      </nav>
    </header>

    <main>
      <section class="contact-hero contact-hero--texture">
        <div class="container">
          <h1>Contact</h1>
        </div>
      </section>

      <section class="container section">
        <div class="contact-cards">
          <a
            class="contact-card contact-card--texture"
            href="https://www.linkedin.com/in/octavia-sirbu/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="contact-icon" aria-hidden="true">☕</span>
            <h3>Let's connect</h3>
            <p>linkedin.com/in/octavia-sirbu</p>
          </a>

          <button class="contact-card contact-card-button" id="copyEmailCard" type="button">
            <span class="contact-icon" aria-hidden="true">
              <img src="assets/icons/copy-01.svg" alt="" width="24" height="24" decoding="async" />
            </span>
            <h3>Copy email</h3>
            <p id="emailValue">octaviasirbu@gmail.com</p>
          </button>

          <a class="contact-card" href="assets/octavia-sirbu-cv.pdf" download>
            <span class="contact-icon" aria-hidden="true">
              <img src="assets/icons/download-01.svg" alt="" width="24" height="24" decoding="async" />
            </span>
            <h3>Download CV</h3>
            <p>octavia-sirbu-cv.pdf</p>
          </a>
        </div>
        <p id="copyFeedback" class="form-message" aria-live="polite"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <div class="site-footer__brand">
          <img
            class="site-footer__logo"
            src="assets/portfolio-logo.svg"
            alt=""
            width="130"
            height="114"
            decoding="async"
          />
          <p class="site-footer__tagline">Turning complexity into clear experiences</p>
          <p>© 2026 Octavia Sirbu - Product Designer</p>
        </div>
        <nav class="site-footer__nav" aria-label="Main pages">
          <ul class="site-footer__list">
            <li><a href="index.html">Home</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
        <div class="site-footer__social">
          <a
            class="site-footer__linkedin"
            href="https://www.linkedin.com/in/octaviasirbu/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              class="site-footer__linkedin-icon"
              src="assets/icons/linkedin-02.svg"
              alt=""
              width="24"
              height="24"
              decoding="async"
            />
            <span>My LinkedIn</span>
          </a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
