<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Alex Morgan</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">Alex Morgan</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="work.html">Work</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container section">
      <h1>Contact Me</h1>
      <p class="intro">
        Have a project in mind? Share the details and I will get back to you.
      </p>

      <form class="contact-form" id="contactForm">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required />

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required />

        <label for="company">Company</label>
        <input id="company" name="company" type="text" />

        <label for="message">Project Details</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button class="btn" type="submit">Send Message</button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Alex Morgan - UX/UI Designer</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
